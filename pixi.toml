[workspace]
authors = ["Joshua Siraj <joshua.siraj@ryerson.ca>"]
channels = ["conda-forge"]
name = "med-imagenet-dashboard"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
combine-panels = "python scripts/combine_modality_sources_panel.py"

[dependencies]
python = ">=3.13,<3.14"

[pypi-dependencies]
streamlit = ">=1.54.0, <2"
google-adk = ">=1.26.0, <2"
plotly = ">=6.6.0, <7"
qrcode = ">=8.0, <9"
pillow = ">=10.0, <13"
med-imagenet = ">=0.4.0, <0.5"
